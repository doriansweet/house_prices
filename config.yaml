project:
  name: house-prices-regression
  task: regression
  random_state: 42

data:
  train_path: data/train.csv
  test_path: data/test.csv
  target: SalePrice
  id_column: Id

features:
  enabled: true
  groups:
    - all

validation:
  n_splits: 5
  shuffle: true
  scoring: neg_root_mean_squared_error
  n_jobs: 1

preprocessing_profiles:
  linear:
    imputation: semantic
    scale_numeric: true
    categorical_encoding: onehot

  knn:
    imputation: semantic
    scale_numeric: true
    categorical_encoding: onehot

  tree:
    imputation: semantic
    scale_numeric: false
    categorical_encoding: onehot

  boosting:
    imputation: semantic
    scale_numeric: false
    categorical_encoding: onehot

  dnn:
    imputation: semantic
    scale_numeric: true
    categorical_encoding: onehot

models:
  linear_regression:
    enabled: true
    preprocessing: linear
    param_grid: {}

  ridge:
    enabled: true
    preprocessing: linear
    param_grid:
      alpha: [1.0, 10.0, 30.0]

  lasso:
    enabled: true
    preprocessing: linear
    param_grid:
      alpha: [0.0005, 0.001]
      max_iter: [10000]

  elastic_net:
    enabled: true
    preprocessing: linear
    param_grid:
      alpha: [0.0005]
      l1_ratio: [0.3, 0.7]
      max_iter: [10000]

  knn:
    enabled: true
    preprocessing: knn
    param_grid:
      n_neighbors: [5, 10]
      weights: [distance]
      p: [2]

  decision_tree:
    enabled: true
    preprocessing: tree
    param_grid:
      max_depth: [5, 10, null]
      min_samples_leaf: [1, 3]

  random_forest:
    enabled: true
    preprocessing: tree
    param_grid:
      n_estimators: [300]
      max_depth: [15, null]
      min_samples_leaf: [1, 3]
      max_features: [0.7]
      n_jobs: [-1]

  xgboost:
    enabled: true
    preprocessing: boosting
    param_grid:
      n_estimators: [700]
      learning_rate: [0.03]
      max_depth: [3, 5]
      subsample: [0.8]
      colsample_bytree: [0.8]

  lightgbm:
    enabled: true
    preprocessing: boosting
    param_grid:
      n_estimators: [700]
      learning_rate: [0.03]
      num_leaves: [15, 31]
      max_depth: [-1]

  catboost:
    enabled: true
    preprocessing: boosting
    param_grid:
      iterations: [700]
      learning_rate: [0.03]
      depth: [4, 6]
      l2_leaf_reg: [3]
      verbose: [false]

  dnn:
    enabled: true
    preprocessing: dnn
    param_grid:
      hidden_sizes:
        - [128, 64]
        - [256, 128, 64]
      activation: [relu]
      dropout: [0.2]
      batch_norm: [true]
      optimizer: [adam]
      scheduler: [cosine]
      learning_rate: [0.001]
      batch_size: [64]
      epochs: [100]
      loss: [mse]
      device: [cpu]

ensemble:
  enabled: true
  models:
    - catboost
    - xgboost
    - lightgbm
  weights: null
  submission_directory: submissions/fold_ensembles

output:
  results_path: results/experiments.csv
  submission_path: submissions/best_submission.csv
  best_model_path: models/best_model.joblib